<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listar Pedidos - Pizzaria</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

<h2 th:text="#{label.orders.list}"></h2>

<table>
    <thead>
    <tr>
        <th th:text="#{label.table.id}"></th>
        <th th:text="#{label.table.client}"></th>
        <th th:text="#{label.table.pizza.flavor}"></th>
        <th th:text="#{label.table.date.time}"></th>
        <th th:text="#{label.table.actions}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pedido : ${pedidos}">
        <td th:text="${pedido.id}"></td>
        <td th:text="${pedido.cliente != null} ? ${pedido.cliente.nomeCompleto} : 'Cliente não encontrado'"></td>
        <td th:text="${pedido.saborPizza}"></td>
        <td th:text="${#temporals.format(pedido.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
        <td>
            <a th:href="@{/pedidos/editar/{id}(id=${pedido.id})}" th:text="#{label.action.edit}"></a> |
            <a th:href="@{/pedidos/excluir/{id}(id=${pedido.id})}" th:text="#{label.action.delete}" onclick="return confirm('Tem certeza que deseja excluir?')"></a>
        </td>
    </tr>
    </tbody>
</table>

<div th:replace="~{fragments/rodape :: rodape}"></div>
</body>
</html>
