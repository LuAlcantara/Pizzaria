<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Cliente - Pizzaria</title>
</head>
<body>
<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

<h2>Detalhes do Cliente</h2>
<p><strong>Nome:</strong> <span th:text="${cliente.nomeCompleto}"></span></p>
<p><strong>Endereço:</strong> <span th:text="${cliente.endereco}"></span></p>
<p><strong>Número de Celular:</strong> <span th:text="${cliente.numeroCelular}"></span></p>
<a th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar Cliente</a> |
<a th:href="@{/pedidos/novo}">Fazer Pedido</a>

<div th:replace="~{fragments/rodape :: rodape}"></div>
</body>
</html>
