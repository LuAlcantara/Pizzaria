<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{label.clients.list}"></title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

<h2 th:text="#{label.clients.list}"></h2>

<table>
    <thead>
    <tr>
        <th th:text="#{label.table.id}"></th>
        <th th:text="#{label.full.name}"></th>
        <th th:text="#{label.address}"></th>
        <th th:text="#{label.phone.number}"></th>
        <th th:text="#{label.table.actions}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.id}"></td>
        <td th:text="${cliente.nomeCompleto}"></td>
        <td th:text="${cliente.endereco}"></td>
        <td th:text="${cliente.numeroCelular}"></td>
        <td>
            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" th:text="#{label.action.edit}"></a> |
            <a th:href="@{/clientes/excluir/{id}(id=${cliente.id})}" th:text="#{label.action.delete}" onclick="return confirm('Tem certeza que deseja excluir?')"></a> |
            <a th:href="@{/pedidos/novo/cliente/{id}(id=${cliente.id})}" th:text="#{label.nav.new.order}"></a>
        </td>
    </tr>
    </tbody>
</table>

<div th:replace="~{fragments/rodape :: rodape}"></div>
</body>
</html>
