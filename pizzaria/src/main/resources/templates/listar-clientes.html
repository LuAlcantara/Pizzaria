<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listar Clientes - Pizzaria</title>
</head>
<body>
<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

<h2>Lista de Clientes</h2>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Endereço</th>
        <th>Número de Celular</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cliente : ${clientes}">
        <td th:text="${cliente.id}"></td>
        <td th:text="${cliente.nomeCompleto}"></td>
        <td th:text="${cliente.endereco}"></td>
        <td th:text="${cliente.numeroCelular}"></td>
        <td>
            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a> |
            <a th:href="@{/clientes/excluir/{id}(id=${cliente.id})}" onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:replace="~{fragments/rodape :: rodape}"></div>
</body>
</html>
