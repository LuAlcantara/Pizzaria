<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{label.search.client.existing}"></title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

<h2 th:text="#{label.search.client.existing}"></h2>

<div th:if="${mensagem}" class="mensagem-erro">
    <span th:text="${mensagem}"></span>
</div>

<form th:action="@{/clientes/buscar}" method="post">
    <div>
        <label for="numeroCelular" th:text="#{label.phone.number}"></label>
        <input type="text" id="numeroCelular" name="numeroCelular" th:value="${numeroCelular}" />
    </div>
    <button type="submit" th:text="#{label.button.search}"></button>
</form>

<div th:replace="~{fragments/rodape :: rodape}"></div>
</body>
</html>
